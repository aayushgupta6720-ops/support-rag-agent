services:
  - type: web
    name: support-rag-agent
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: QDRANT_COLLECTION
        value: support_docs
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP   # Render sits behind Cloudflare, which sets this; the rate limit keys on it
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Internal URL of the support-rag-agent-kv Key Value instance (free
      # plan, Oregon, internal access only), which holds rate-limit counts and
      # chat sessions: redis://<instance id>:6379. The instance was created
      # outside this Blueprint, so it's set here by hand, not via fromService.
      - key: REDIS_URL
        sync: false
